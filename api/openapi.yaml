        sub_categories:
        - parent_id: 5
          name: new category
          id: 1
          slug: new-category
        - parent_id: 5
          name: new category
          id: 1
          slug: new-category
        parent_id: 6
        name: new category
        id: 0
        slug: new-category
      properties:
        id:
          type: integer
        parent_id:
          type: integer
        name:
          example: new category
          type: string
        slug:
          example: new-category
          type: string
        sub_categories:
