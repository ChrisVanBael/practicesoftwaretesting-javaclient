        name: new category
        id: 1
        slug: new-category
      properties:
        id:
          type: integer
        parent_id:
          type: integer
        name:
          example: new category
          type: string
        slug:
          example: new-category
          type: string
      title: CategoryResponse
      type: object
    ProductRequest:
      example:
        category_id: 1
        price: 1.99
        name: name
        description: description
        product_image_id: 1
        brand_id: 1
      properties:
        name:
          type: string
        description:
          type: string
        price:
          example: 1.99
          type: number
        category_id:
          example: 1
          type: integer
        brand_id:
          example: 1
          type: integer
        product_image_id:
          example: 1
          type: integer
      title: ProductRequest
      type: object
    ProductResponse:
      example:
        price: 9.99
        product_image:
          file_name: file_name
          by_url: by_url
          by_name: by_name
          id: 0
          title: title
          source_name: source_name
          source_url: source_url
        name: new brand
        description: Lorum ipsum
        id: 1
        category:
          parent_id: 5
          name: new category
          id: 1
          slug: new-category
        brand:
